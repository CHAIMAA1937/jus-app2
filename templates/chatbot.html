
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant - Concentration du jus</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f3;
            padding: 30px 15px;
        }

        .chat-container {
            max-width: 750px;
            height: 600px;
            margin: auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #176b55;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h2 {
            margin: 0 0 7px;
        }

        .chat-header p {
            margin: 0;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            max-width: 80%;
            line-height: 1.5;
        }

        .bot {
            background: #e8f2ee;
            color: #234c3e;
        }

        .user {
            background: #176b55;
            color: white;
            margin-left: auto;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        .chat-form input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .chat-form button {
            background: #176b55;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
        }

        .chat-form button:hover {
            background: #125642;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #176b55;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <h2>Assistant virtuel</h2>
            <p>Application de concentration du jus</p>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message bot">
                Bonjour ! Je suis votre assistant virtuel.
                Posez-moi vos questions sur le procédé de concentration du jus.
            </div>
        </div>

        <form class="chat-form" id="chat-form">
            <input
                type="text"
                id="message"
                placeholder="Écrivez votre question..."
                required
            >

            <button type="submit">Envoyer</button>
        </form>

    </div>

    <a href="/" class="back-link">Retour à l'application</a>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const messages = document.getElementById("messages");

        function ajouterMessage(texte, type) {
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = texte;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = input.value.trim();

            if (!message) return;

            ajouterMessage(message, "user");
            input.value = "";

            try {
                const response = await fetch("/chatbot", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    throw new Error("Erreur du serveur");
                }

                const data = await response.json();

                ajouterMessage(data.reponse, "bot");

            } catch (error) {
                ajouterMessage(
                    "Une erreur est survenue. Veuillez réessayer.",
                    "bot"
                );
            }
        });
    </script>

</body>
</html>
